##############################################################################
# .gitlab-ci.yml — Ralph Autonomous Development Loop
#
# For each open issue labelled `ai-ralph` (or a specific issue via ISSUE_IID):
#   1. @prd             — generate .ralph/prd.md from issue description
#   2. @ralph-converter — convert .ralph/prd.md to .ralph/prd.json
#   3. ralph            — autonomous implementation loop
#   4. @reporter        — write .ralph/mr.md (MR description)
#   5. COMPLETE         → commit, open MR
#   Artifacts: .ralph/ contents saved per issue
#
# Trigger manually:
#   - Via UI:  Pipeline → Run pipeline (set variables as needed)
#   - Via API: POST /projects/:id/trigger/pipeline
#   - Via schedule: set up in GitLab CI/CD → Schedules
#
# Key variables to override:
#   ISSUE_IID            — run on a single issue instead of scanning by label
#   TARGET_LABEL         — label to scan for (default: ai-ralph)
#   RALPH_MAX_ITERATIONS — max loop iterations per issue (default: 12)
#   MAIN_BRANCH          — target branch for MRs (default: main)
##############################################################################

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'

stages:
  - autonomous-development

default:
  image: registry.your-company.com/opencode-ralph:latest
  timeout: 2h

variables:
  VLLM_API_URL:
    value: "http://ai-server.internal:8000/v1"
    description: "vLLM endpoint URL (override in project CI/CD settings for production)"
  VLLM_MODEL_NAME:
    value: "codestral-22b"
    description: "Model name served by the vLLM endpoint"
  VLLM_API_KEY:
    value: "local-secret"
    description: "API key for the vLLM endpoint (use a protected CI/CD variable in production)"
  TARGET_LABEL:
    value: "ai-ralph"
    description: "GitLab issue label to scan — all open issues with this label will be processed"
  BRANCH_PREFIX:
    value: "ai/ralph"
    description: "Prefix for feature branches created by Ralph"
  RALPH_MAX_ITERATIONS:
    value: "12"
    description: "Maximum ralph loop iterations per issue before giving up"
  MAIN_BRANCH:
    value: "main"
    description: "Target branch for MRs and git operations (change to master/develop if needed)"
  ISSUE_IID:
    value: ""
    description: "Run on a single issue by IID — leave empty to scan by TARGET_LABEL"

ralph:
  stage: autonomous-development

  script:
    - |
      set -euo pipefail

      # ── 0. Setup ─────────────────────────────────────────────────────────────
      git config --global user.email "ralph-bot@${CI_SERVER_HOST}"
      git config --global user.name  "Ralph Autonomous Worker"
      git remote set-url origin \
        "https://oauth2:${PROJECT_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      mkdir -p artifacts

      # ── 1. Fetch issues ───────────────────────────────────────────────────────
      if [ -n "${ISSUE_IID}" ]; then
        echo "==> Running on single issue #${ISSUE_IID} ..."
        SINGLE=$(curl -fsSL \
          --header "PRIVATE-TOKEN: ${PROJECT_BOT_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues/${ISSUE_IID}")
        ISSUES_JSON="[${SINGLE}]"
      else
        echo "==> Fetching issues labelled '${TARGET_LABEL}' ..."
        ISSUES_JSON=$(curl -fsSL \
          --header "PRIVATE-TOKEN: ${PROJECT_BOT_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues?labels=${TARGET_LABEL}&state=opened&per_page=20")
      fi

      ISSUE_COUNT=$(echo "${ISSUES_JSON}" | jq 'length')
      echo "    Found ${ISSUE_COUNT} issue(s)"
      [[ "${ISSUE_COUNT}" -eq 0 ]] && echo "==> Nothing to do." && exit 0

      # ── 2. Per-issue loop ─────────────────────────────────────────────────────
      echo "${ISSUES_JSON}" | jq -c '.[]' | while IFS= read -r ISSUE; do

        IID=$(   echo "${ISSUE}" | jq -r '.iid')
        TITLE=$( echo "${ISSUE}" | jq -r '.title')
        BODY=$(  echo "${ISSUE}" | jq -r '.description // "No description provided."')
        ISSUE_URL="${CI_PROJECT_URL}/-/issues/${IID}"

        SAFE_TITLE=$(echo "${TITLE}" \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's/[^a-z0-9-]/-/g; s/--*/-/g; s/^-\|-$//g' \
          | cut -c1-40)
        BRANCH="${BRANCH_PREFIX}-${IID}-${SAFE_TITLE}"
        ARTIFACT_DIR="artifacts/issue-${IID}"
        mkdir -p "${ARTIFACT_DIR}"

        echo ""
        echo "════════════════════════════════════════════════"
        echo " ISSUE #${IID}: ${TITLE}"
        echo " BRANCH   : ${BRANCH}"
        echo "════════════════════════════════════════════════"

        # ── Clean repo and create branch ─────────────────────────────────────
        git fetch origin "${MAIN_BRANCH}" --quiet
        git checkout "${MAIN_BRANCH}" --quiet
        git pull origin "${MAIN_BRANCH}" --quiet
        git clean -fdx -e artifacts/

        if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null 2>&1; then
          echo "WARN: Branch '${BRANCH}' already exists — skipping"
          printf 'STATUS: SKIP\nREASON: branch_exists\n' > "${ARTIFACT_DIR}/result.txt"
          continue
        fi

        git checkout -b "${BRANCH}"
        mkdir -p .ralph

        # ── Step 1: Generate PRD ──────────────────────────────────────────────
        echo "==> [1/4] Generating PRD ..."
        PRD_PROMPT=$(printf '@prd Issue #%s: %s\n\n%s' "${IID}" "${TITLE}" "${BODY}")
        opencode run "${PRD_PROMPT}" --dangerously-skip-permissions \
          2>&1 | tee "${ARTIFACT_DIR}/step1-prd.log" || true

        if [ ! -f ".ralph/prd.md" ]; then
          printf 'STATUS: ERROR\nREASON: .ralph/prd.md not generated\n' > "${ARTIFACT_DIR}/result.txt"
          git checkout "${MAIN_BRANCH}" --quiet && git branch -D "${BRANCH}" 2>/dev/null || true
          rm -rf .ralph/ && continue
        fi

        # ── Step 2: Convert PRD to prd.json ──────────────────────────────────
        echo "==> [2/4] Converting PRD to prd.json ..."
        opencode run "@ralph-converter" --dangerously-skip-permissions \
          2>&1 | tee "${ARTIFACT_DIR}/step2-converter.log" || true

        if [ ! -f ".ralph/prd.json" ]; then
          printf 'STATUS: ERROR\nREASON: .ralph/prd.json not generated\n' > "${ARTIFACT_DIR}/result.txt"
          git checkout "${MAIN_BRANCH}" --quiet && git branch -D "${BRANCH}" 2>/dev/null || true
          rm -rf .ralph/ && continue
        fi

        # ── Step 3: Run ralph loop ────────────────────────────────────────────
        echo "==> [3/4] Running ralph (max ${RALPH_MAX_ITERATIONS} iterations) ..."
        ralph "${RALPH_MAX_ITERATIONS}" 2>&1 | tee "${ARTIFACT_DIR}/step3-ralph.log" || true

        # ── Collect git artifacts ─────────────────────────────────────────────
        git diff  "${MAIN_BRANCH}...HEAD"          > "${ARTIFACT_DIR}/changes.diff"  2>/dev/null || true
        git diff  "${MAIN_BRANCH}...HEAD" --stat   > "${ARTIFACT_DIR}/changes.stat"  2>/dev/null || true
        git log   "${MAIN_BRANCH}...HEAD" --oneline > "${ARTIFACT_DIR}/commits.txt"  2>/dev/null || true

        # ── Signal detection ──────────────────────────────────────────────────
        if grep -q '<promise>COMPLETE</promise>' "${ARTIFACT_DIR}/step3-ralph.log"; then

          # ── Step 4: Generate MR description ────────────────────────────────
          echo "==> [4/4] Generating MR description ..."
          opencode run "@reporter" --dangerously-skip-permissions \
            2>&1 | tee "${ARTIFACT_DIR}/step4-reporter.log" || true

          MR_BODY=$(cat ".ralph/mr.md" 2>/dev/null || echo "Closes #${IID}")

          git add --all
          git restore --staged .ralph/ 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "feat(#${IID}): ${TITLE}"$'\n\n'"Closes #${IID}"
            git push origin "${BRANCH}"

            MR_RESPONSE=$(curl -fsSL --request POST \
              --header "PRIVATE-TOKEN: ${PROJECT_BOT_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$(jq -n \
                --arg src    "${BRANCH}" \
                --arg target "${MAIN_BRANCH}" \
                --arg title  "feat(#${IID}): ${TITLE}" \
                --arg desc   "${MR_BODY}" \
                '{source_branch:$src,target_branch:$target,title:$title,description:$desc,remove_source_branch:true,squash:false,labels:"ai-generated"}')" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests")

            MR_URL=$(echo "${MR_RESPONSE}" | jq -r '.web_url // "unknown"')
            MR_IID=$(echo "${MR_RESPONSE}" | jq -r '.iid // "?"')
            echo "    MR created: ${MR_URL}"

            curl -fsSL --request PUT \
              --header "PRIVATE-TOKEN: ${PROJECT_BOT_TOKEN}" \
              --data "add_labels=ai-review-pending" \
              "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/issues/${IID}" > /dev/null

            printf 'STATUS: COMPLETE\nMR: !%s - %s\n' "${MR_IID}" "${MR_URL}" > "${ARTIFACT_DIR}/result.txt"
          else
            echo "WARN: Empty diff — skipping MR"
            printf 'STATUS: SKIP\nREASON: empty_diff\n' > "${ARTIFACT_DIR}/result.txt"
          fi

        else
          echo "WARN: No COMPLETE signal — max iterations reached or opencode error"
          printf 'STATUS: INCOMPLETE\nREASON: max iterations reached or opencode error\n' > "${ARTIFACT_DIR}/result.txt"
        fi

        # ── Copy .ralph/ to artifacts then clean ──────────────────────────────
        cp -r .ralph/. "${ARTIFACT_DIR}/ralph/" 2>/dev/null || true
        rm -rf .ralph/
        git checkout "${MAIN_BRANCH}" --quiet
        git branch -D "${BRANCH}" 2>/dev/null || true
        echo "==> Done issue #${IID}"

      done

      # ── 3. Summary ────────────────────────────────────────────────────────────
      echo ""
      echo "════════════════════════════════════════════════"
      echo " Ralph Run — Summary (Job #${CI_JOB_ID})"
      echo "════════════════════════════════════════════════"
      for RESULT_FILE in artifacts/issue-*/result.txt; do
        [[ -f "${RESULT_FILE}" ]] || continue
        IID=$(echo "${RESULT_FILE}" | grep -o 'issue-[0-9]*' | grep -o '[0-9]*')
        STATUS=$(grep '^STATUS:' "${RESULT_FILE}" | sed 's/^STATUS:[[:space:]]*//')
        case "${STATUS}" in
          COMPLETE)   ICON="✅" ;;
          SKIP*)      ICON="⏭ " ;;
          INCOMPLETE) ICON="⏱ " ;;
          *)          ICON="❌" ;;
        esac
        printf '%s  #%-6s %s\n' "${ICON}" "${IID}" "${STATUS}"
      done
      echo " Artifacts: ${CI_JOB_URL}/artifacts"
      echo "════════════════════════════════════════════════"

  artifacts:
    name: "ralph-${CI_JOB_ID}"
    paths:
      - artifacts/
    when: always
    expire_in: 30 days
